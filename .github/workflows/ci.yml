name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  CEDEV_VERSION: v15.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache the CE toolchain
        id: cedev
        uses: actions/cache@v4
        with:
          path: ~/CEdev
          key: cedev-${{ env.CEDEV_VERSION }}

      - name: Install the CE toolchain
        if: steps.cedev.outputs.cache-hit != 'true'
        run: |
          url=https://github.com/CE-Programming/toolchain/releases/download/${CEDEV_VERSION}/CEdev-Linux.tar.gz
          curl -fsSL "$url" -o /tmp/cedev.tar.gz
          tar -xzf /tmp/cedev.tar.gz -C "$HOME"
          chmod +x "$HOME"/CEdev/bin/*

      - name: Put the CE toolchain on PATH
        run: echo "$HOME/CEdev/bin" >> "$GITHUB_PATH"

      - name: Install ce-libify into the toolchain
        run: make install

      - name: Build the demo library
        working-directory: demo
        run: |
          set -euo pipefail
          ce-libify exports --exports exports.txt --header demo.h --prefix demo_
          ce-libify build --name DEMO --src src --headers . --exports exports.txt
          test -s bin/DEMO.8xv
          test -s bin/DEMO.lib
          grep -q "export	demo_add" bin/DEMO.lib
          grep -q "export	demo_name" bin/DEMO.lib

      - name: Link a program against the demo library
        working-directory: demo
        run: |
          set -euo pipefail
          mkdir -p prog/src
          cat > prog/makefile <<'MAKEFILE'
          NAME = MYPROG
          CFLAGS = -Wall -Wextra -Oz -I..
          LTOFLAGS = -Wall -Wextra -Oz
          EXTRA_LIBLOAD_LIBS = ../bin/DEMO.lib

          include $(shell cedev-config --makefile)
          MAKEFILE
          cat > prog/src/main.c <<'SOURCE'
          #include <tice.h>
          #include <stdio.h>
          #include "demo.h"

          int main(void)
          {
              os_ClrHome();
              printf("%s: %u\n", demo_name(), demo_add(2, 3));
              while (!os_GetCSC());
              return 0;
          }
          SOURCE
          make -C prog
          test -s prog/bin/MYPROG.8xp
          grep -q "__libload_library_DEMO" prog/obj/crt.h

  release:
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build every target
        run: |
          set -euo pipefail
          mkdir -p dist
          while read -r goos goarch; do
            suffix=""
            if [ "$goos" = "windows" ]; then suffix=".exe"; fi
            out="dist/ce-libify-${goos}-${goarch}${suffix}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath               -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "$out" .
            echo "built $out"
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          TARGETS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "ce-libify ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
